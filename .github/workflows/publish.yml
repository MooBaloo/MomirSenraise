name: Build signed channels

on:
  push:
    branches: [main, dev]

permissions:
  contents: read

# Queued runs never supersede an in-flight signing/publication transaction.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pull-requests: read
    # Deliberately unconfigured in this foundation. Enable only after setup review.
    if: github.repository == 'MooBaloo/MomirSenraise' && vars.RELEASE_AUTOMATION_ENABLED == 'true' && vars.RELEASE_IMMUTABILITY_VERIFIED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      channel: ${{ steps.plan.outputs.channel }}
      code: ${{ steps.plan.outputs.code }}
      source: ${{ steps.plan.outputs.source }}
      trusted: ${{ steps.plan.outputs.trusted }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan exact source and allocate version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/pipeline.py plan "$GITHUB_OUTPUT"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: steps.plan.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        if: steps.plan.outputs.enabled == 'true'
        with:
          packages: platform-tools
      - name: Build and test without signing credentials
        if: steps.plan.outputs.enabled == 'true'
        env:
          BUILD_CHANNEL: ${{ steps.plan.outputs.channel }}
          BUILD_CODE: ${{ steps.plan.outputs.code }}
        run: |
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
          python3 -m unittest discover -s tools/release -p 'test_*.py'
          bash ./gradlew --no-daemon :app:assembleRelease :app:testDebugUnitTest -PpublishBuild=true -PbuildChannel="$BUILD_CHANNEL" -PbuildVersionCode="$BUILD_CODE" -PbuildSourceRevision="$GITHUB_SHA"
          cp app/build/outputs/apk/release/app-release-unsigned.apk build/release/unsigned.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.plan.outputs.enabled == 'true'
        with:
          name: unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release/
          retention-days: 2
          if-no-files-found: error

  sign:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: signing-${{ needs.build.outputs.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.build.outputs.trusted }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - run: sdkmanager 'build-tools;34.0.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release
      - name: Verify identity, sign and verify signature
        env:
          EXPECTED_CHANNEL: ${{ needs.build.outputs.channel }}
          EXPECTED_SOURCE: ${{ needs.build.outputs.source }}
          EXPECTED_CODE: ${{ needs.build.outputs.code }}
          EXPECTED_CERT_SHA256: ${{ needs.build.outputs.channel == 'stable' && vars.STABLE_CERT_SHA256 || vars.DEV_CERT_SHA256 }}
          OTHER_CHANNEL_CERT_SHA256: ${{ needs.build.outputs.channel == 'stable' && vars.DEV_CERT_SHA256 || vars.STABLE_CERT_SHA256 }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: python3 tools/release/pipeline.py sign build/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.build.outputs.trusted }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - run: sdkmanager 'build-tools;34.0.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release
      - name: Verify and publish complete assets
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CHANNEL: ${{ needs.build.outputs.channel }}
          EXPECTED_SOURCE: ${{ needs.build.outputs.source }}
          EXPECTED_CODE: ${{ needs.build.outputs.code }}
          EXPECTED_CERT_SHA256: ${{ needs.build.outputs.channel == 'stable' && vars.STABLE_CERT_SHA256 || vars.DEV_CERT_SHA256 }}
        run: python3 tools/release/pipeline.py publish build/release
