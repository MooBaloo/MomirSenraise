name: Build and test

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Check release guards without credentials
        run: python3 -m unittest discover -s tools/release -p 'test_*.py'
      - name: Build debug and unsigned release APKs
        run: |
          bash ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest
          bash ./gradlew --no-daemon :app:assembleRelease -PbuildChannel=stable
